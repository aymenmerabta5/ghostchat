[package]
name = "ghostchat-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ghostchat desktop client"
publish = false

[[bin]]
name = "ghostchat"
path = "src/main.rs"

[dependencies]
ghostchat-protocol.workspace = true
ghostchat-crypto.workspace = true
ghostchat-core.workspace = true
ghostchat-ble.workspace = true
ghostchat-nostr.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
iced.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = { workspace = true }
rfd.workspace = true
qrcode.workspace = true
rqrr.workspace = true
image.workspace = true
rand.workspace = true
zeroize.workspace = true
# The group signer signs with our identity's Ed25519 key; the roster pins the
# public half. Test-only before groups existed.
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }
notify-rust = "4"
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
chacha20poly1305.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[build-dependencies]
embed-resource = "3.0.12"