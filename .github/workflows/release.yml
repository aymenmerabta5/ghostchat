name: release

# Push a tag like v0.1.0 to build both portable binaries from that commit and
# attach them to a DRAFT GitHub Release. Publishing the draft stays manual.
# Run it by hand (workflow_dispatch) to rehearse: same builds, notes and sums,
# uploaded as an artifact, no Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'rehearsal' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build -p ghostchat-app --release
      - run: cargo run -q -p ghostchat-xtask -- dist target/release/ghostchat.exe dist/windows
      - name: Build the Windows installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          ./packaging/windows/build-installer.ps1 -Dist dist/windows -Out dist
          $version = (Get-Content dist/windows/ghostchat.exe.json -Raw | ConvertFrom-Json).version
          Move-Item "dist/ghostchat-$version-windows-x86_64-setup.exe" "ghostchat-$env:NAME-windows-x86_64-setup.exe"
      - shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath "ghostchat-$env:NAME-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ghostchat-*.zip
            ghostchat-*-setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev dpkg-dev
      - run: cargo test --workspace
      - run: cargo build -p ghostchat-app --release
      - run: cargo run -q -p ghostchat-xtask -- dist target/release/ghostchat dist/linux
      - run: cd dist/linux && sha256sum -c ghostchat.sha256
      - name: Build the Debian package
        run: |
          bash packaging/linux/build-deb.sh
          sudo dpkg -i dist/ghostchat_*.deb
          ghostchat --help >/dev/null
          sudo dpkg -r ghostchat
          cp dist/ghostchat_*.deb .
      - run: tar -C dist/linux -czf "ghostchat-$NAME-linux-x86_64.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            ghostchat-*.tar.gz
            ghostchat_*.deb

  draft:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Tag must match the crate version
        run: |
          tar -xzf ghostchat-*-linux-x86_64.tar.gz ./ghostchat.json
          version=$(python3 -c "import json; print(json.load(open('ghostchat.json'))['version'])")
          rm ghostchat.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != crate v$version"; exit 1; }
          fi
      - name: Release notes are the CHANGELOG.md section for this version
        run: |
          if grep -q "^## $VERSION (unreleased)" src/CHANGELOG.md; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "CHANGELOG.md still says $VERSION (unreleased)"; exit 1; fi
            echo "::warning::CHANGELOG.md still says $VERSION (unreleased); a tag would stop here"
          fi
          awk -v v="$VERSION" 'index($0, "## " v) == 1 {on=1; next} on && /^## / {exit} on {print}' src/CHANGELOG.md \
            | sed -E "s#\]\((\./)?([A-Za-z][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\2)#g" > NOTES.md
          test -s NOTES.md || { echo "CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          cat NOTES.md
      - run: sha256sum ghostchat-* ghostchat_* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" ghostchat-* ghostchat_* SHA256SUMS.txt
          --repo "${{ github.repository }}" --draft --verify-tag
          --title "ghostchat ${{ github.ref_name }}"
          --notes-file NOTES.md
      - name: Keep the rehearsal
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-rehearsal
          path: |
            ghostchat-*
            ghostchat_*
            SHA256SUMS.txt
            NOTES.md
